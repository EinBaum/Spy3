name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Spy3
      - name: Package addon
        run: zip -r "Spy3-${GITHUB_REF_NAME#v}.zip" Spy3 -x 'Spy3/.git/*' 'Spy3/.github/*'
      - uses: softprops/action-gh-release@v2
        with:
          files: Spy3-*.zip
          generate_release_notes: true
